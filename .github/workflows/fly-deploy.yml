name: Deploy to Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy lawnsmith-whatsapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile . --remote-only -a lawnsmith-whatsapp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Status
        run: flyctl status -a lawnsmith-whatsapp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://lawnsmith-whatsapp.fly.dev/health; then echo; exit 0; fi
            sleep 10
          done
          echo "Health check failed" >&2
          exit 1
