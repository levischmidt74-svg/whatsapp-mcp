# Fly.io app for the remote WhatsApp MCP.
#
# Deploy from the repo root:
#   flyctl deploy --config deploy/fly/fly.toml --dockerfile deploy/fly/Dockerfile .
#
# The bridge (whatsmeow session) and MCP server share /data on a single
# machine because the MCP reads SQLite directly. Auto-stop is OFF so the
# WhatsApp Web session stays connected; if Fly stops the machine the
# session disconnects and you have to re-pair.

app = "lawnsmith-whatsapp"
primary_region = "dfw"

[build]

[env]
  WHATSAPP_BRIDGE_PORT = "8080"
  WHATSAPP_API_URL    = "http://127.0.0.1:8080/api"
  WHATSAPP_DB_PATH    = "/data/store/messages.db"
  WHATSMEOW_DB_PATH   = "/data/store/whatsapp.db"
  OAUTH_DB_PATH       = "/data/store/oauth.db"
  MCP_PORT            = "3000"
  PUBLIC_PORT         = "8000"
  PUBLIC_BASE_URL     = "https://lawnsmith-whatsapp.fly.dev"

# Secret (set with: fly secrets set MCP_BEARER_TOKEN=... -a lawnsmith-whatsapp)
#   MCP_BEARER_TOKEN — required. Two roles:
#     1. Consent-screen shared secret. Anyone who knows it can authorize a
#        new OAuth client and mint access tokens.
#     2. Admin/curl bearer for /mcp (bypasses OAuth flow). Use sparingly.

[http_service]
  internal_port        = 8000
  force_https          = true
  auto_stop_machines   = "off"
  auto_start_machines  = false
  min_machines_running = 1

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "60s"
    method       = "GET"
    path         = "/health"

[[mounts]]
  source      = "whatsapp_data"
  destination = "/data"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 512
