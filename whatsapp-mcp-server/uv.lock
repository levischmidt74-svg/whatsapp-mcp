source = { virtual = "." }
dependencies = [
    { name = "anyio" },
    { name = "httpx" },
    { name = "mcp", extra = ["cli"] },
    { name = "python-multipart" },
    { name = "requests" },
    { name = "segno" },
]

[package.optional-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "ruff" },
]
transcribe = [
    { name = "av" },
    { name = "faster-whisper" },
]

[package.metadata]
requires-dist = [
    { name = "anyio", specifier = "<4.14" },
    { name = "av", marker = "extra == 'transcribe'", specifier = "<19" },
    { name = "faster-whisper", marker = "extra == 'transcribe'", specifier = ">=1.2.0" },
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "mcp", extras = ["cli"], specifier = ">=1.27.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=9.0.3" },
    { name = "pytest-asyncio", marker = "extra == 'dev'", specifier = ">=1.3.0" },
    { name = "python-multipart", specifier = ">=0.0.20" },
    { name = "requests", specifier = ">=2.33.1" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.15.11" },
    { name = "segno", specifier = ">=1.6.1" },
]
provides-extras = ["transcribe", "dev"]
